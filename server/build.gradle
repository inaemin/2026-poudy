import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'com.poudy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '3.1.0'
    openApiDocPort = 8099
}

dependencies {
    // testImplementation extends implementation, so it inherits the BOM.
    // developmentOnly does not, so the platform is declared for it separately.
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    developmentOnly platform(SpringBootPlugin.BOM_COORDINATES)

    // OpenAPI 문서를 뽑을 때만 쓰는 인메모리 DB.
    // developmentOnly 라서 bootJar 에는 포함되지 않는다.
    developmentOnly 'com.h2database:h2'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
}

// bootJar만 만들면 되므로 사용하지 않는 plain jar 생성을 끈다.
// 켜두면 build/libs 에 jar 가 두 개 생겨 Dockerfile 의 와일드카드 COPY 가 실패한다.
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// .githooks 를 git 훅 경로로 등록한다. husky 가 하는 일을 git 기본 기능으로 대신한다.
// 클론 후 한 번만 필요하며, build 에 물려두어 따로 실행하지 않아도 되게 한다.
tasks.register('installGitHooks', Exec) {
    group = 'build setup'
    description = 'Registers .githooks as the git hooks directory'
    workingDir = rootProject.projectDir
    commandLine 'git', 'config', 'core.hooksPath', '.githooks'
    // CI 에서는 훅이 쓰이지 않으므로 건너뛴다.
    onlyIf { rootProject.file('../.git').exists() && System.getenv('CI') == null }
    ignoreExitValue = true
}

tasks.named('build') {
    dependsOn 'installGitHooks'
}

// 앱을 띄워 OpenAPI 문서를 openapi.json 으로 뽑는다.
// 문서 생성에는 테이블이 필요 없으므로 DB 는 인메모리로 대체하고,
// 마이그레이션과 스키마 생성을 모두 건너뛴다.
// ddl-auto 를 create-drop 으로 두면 PostgreSQL 전용 타입(jsonb 등)에서
// H2 가 DDL 을 거부해 로그가 오염되므로 none 을 쓴다.
// 기본 포트(8080)를 쓰면 개발 중 띄워둔 앱이 8080 을 점유했을 때
// 포크된 앱이 바인딩에 실패해도 플러그인이 그 앱의 응답을 받아 저장한다.
// 낡은 문서가 조용히 커밋되므로 전용 포트를 쓴다.
openApi {
    outputDir = layout.projectDirectory
    outputFileName = 'openapi.json'
    apiDocsUrl = "http://localhost:${openApiDocPort}/v3/api-docs"
    customBootRun {
        args = [
            "--server.port=${openApiDocPort}",
            '--spring.datasource.url=jdbc:h2:mem:openapi',
            '--spring.datasource.driver-class-name=org.h2.Driver',
            '--spring.datasource.username=sa',
            '--spring.datasource.password=',
            '--spring.flyway.enabled=false',
            '--spring.jpa.hibernate.ddl-auto=none'
        ]
    }
}

// openapi.json 을 프론트엔드가 그대로 쓰는 TypeScript 타입으로 변환한다.
// 프론트엔드는 재생성을 신경 쓸 필요 없이 커밋된 api.d.ts 를 import 하면 된다.
tasks.register('generateApiTypes', Exec) {
    group = 'openapi'
    description = 'Generates TypeScript types from openapi.json'
    dependsOn 'generateOpenApiDocs'

    def output = rootProject.file('../common/api.d.ts')
    def source = layout.projectDirectory.file('openapi.json')

    // 문서 내용이 그대로면 다시 만들지 않는다.
    inputs.file(source)
    outputs.file(output)

    doFirst {
        output.parentFile.mkdirs()
    }
    commandLine 'npx', '--yes', 'openapi-typescript@7.13.0',
            layout.projectDirectory.file('openapi.json').asFile.absolutePath,
            '-o', output.absolutePath
}
