# 로컬 개발용 PostgreSQL. dev 프로필의 기본 접속 정보와 값을 맞춰 두었으므로
# 컨테이너만 띄우면 별도 설정 없이 바로 붙는다.
# CI 의 서비스 컨테이너와 같은 이미지를 써서 로컬과 CI 의 DB 동작을 맞춘다.
services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      POSTGRES_DB: poudy
      POSTGRES_USER: poudy
      POSTGRES_PASSWORD: poudy
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poudy -d poudy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
