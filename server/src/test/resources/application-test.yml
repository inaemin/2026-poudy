spring:
  datasource:
    url: jdbc:h2:mem:poudy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      # 엔티티 기준으로 테이블을 만든다. 이게 없으면 테이블이 하나도 생기지 않아
      # 리포지토리를 쓰는 테스트가 전부 실패한다.
      # 마이그레이션 SQL 자체의 검증은 integration 프로필이 담당한다.
      ddl-auto: create-drop
