# 실제 PostgreSQL 을 대상으로 하는 테스트 프로필.
# Flyway 마이그레이션을 실행하고 엔티티와 스키마가 맞는지 검증한다.
# CI 와 로컬 통합 테스트가 같은 프로필을 쓴다.
#
# 기본값을 두지 않아, 접속 정보가 없으면 조용히 다른 곳에 붙지 않고 즉시 실패한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
