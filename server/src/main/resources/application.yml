spring:
  application:
    name: poudy
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poudy}
    username: ${DB_USERNAME:poudy}
    password: ${DB_PASSWORD:poudy}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
