# 로컬 개발용 프로필. 프로필을 지정하지 않으면 이 프로필로 뜬다.
#
# 접속 대상은 compose.yaml 이 띄우는 로컬 PostgreSQL 이고, 기본값을 그 값에
# 맞춰 두었다. 클론 후 docker compose up -d 만 하면 설정 없이 바로 뜬다.
#
# prod 와 달리 기본값을 두는 이유: 여기서 값을 빠뜨려도 붙을 곳은 로컬뿐이라
# 사고가 나지 않는다. 기본값을 없애 봐야 각자 .env 에 접속 정보를 적게 만들 뿐이고,
# 그 파일에 운영 접속 정보가 들어가는 순간 이 분리가 무의미해진다.
#
# .env 는 이 프로필에서만 읽는다. base 에 두면 운영 컨테이너까지 커밋되지 않은
# 파일을 읽게 되므로, 읽을 이유가 있는 프로필에만 둔다.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poudy}
    username: ${DB_USERNAME:poudy}
    password: ${DB_PASSWORD:poudy}
