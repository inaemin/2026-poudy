name: PR Automation

# pull_request_target 이 아니라 pull_request 를 쓴다.
# 같은 저장소 브랜치에서 올린 PR 은 토큰에 쓰기 권한이 있고,
# pull_request_target 은 포크 PR 의 코드를 쓰기 권한과 함께 실행해 위험하다.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: 변경 경로 레이블
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
