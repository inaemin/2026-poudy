name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'

defaults:
  run:
    working-directory: server

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: poudy
          POSTGRES_USER: poudy
          POSTGRES_PASSWORD: poudy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poudy -d poudy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          DB_URL: jdbc:postgresql://localhost:5432/poudy
          DB_USERNAME: poudy
          DB_PASSWORD: poudy

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: server/build/reports/tests/test
